<style>
  :root{
    --navy-000:#04070f; --navy-100:#0a1228; --navy-300:#132248;
    --gold:#e8c37a; --gold-dim:rgba(232,195,122,.5);
    --txt:#eaf0ff; --txt-2:#9db0d8; --line:rgba(140,170,255,.16);
    --fd:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --ff:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:grid; place-items:center; padding:28px;
    font-family:var(--ff); color:var(--txt); background:var(--navy-000);
    background-image:
      radial-gradient(900px 600px at 15% -10%, rgba(26,45,94,.9), transparent 60%),
      radial-gradient(800px 600px at 90% 8%, rgba(19,34,72,.85), transparent 62%),
      radial-gradient(900px 500px at 50% 110%, rgba(232,195,122,.1), transparent 60%);
    background-attachment:fixed;
  }
  .kart{width:100%; max-width:520px; text-align:center}
  .mark{width:54px;height:54px;margin:0 auto 14px;display:block}
  h1{font-family:var(--fd); font-weight:300; font-size:44px; letter-spacing:.2em;
     color:var(--gold); margin-left:.2em}
  .alt{font-size:12px; letter-spacing:.24em; text-transform:uppercase;
       color:var(--txt-2); margin-top:6px}
  .ayrac{width:64px;height:1px;margin:26px auto;
         background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
  h2{font-size:17px; font-weight:600; margin-bottom:18px}
  .secenekler{display:grid; gap:12px}
  a.btn{
    display:block; padding:17px 20px; border-radius:14px; text-decoration:none;
    border:1px solid var(--line); background:rgba(10,18,40,.72); color:var(--txt);
    transition:.2s;
  }
  a.btn:hover{border-color:var(--gold-dim); background:rgba(19,34,72,.8); transform:translateY(-1px)}
  a.btn b{display:block; font-family:var(--fd); font-size:22px; letter-spacing:.06em; color:var(--gold)}
  a.btn span{display:block; font-size:13px; color:var(--txt-2); margin-top:3px}
  footer{margin-top:30px; font-size:12.5px; color:var(--txt-2); line-height:1.7}
  footer a{color:var(--gold-dim)}
  @media (max-width:420px){ h1{font-size:34px} }
</style>
</head>
